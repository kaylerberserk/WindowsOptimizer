name: batch-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 .github/check-batch.py "All in One.cmd"
      - run: python3 -B -m unittest discover -s .github -p 'test_*.py' -v
      - name: Parse launcher.ps1
        shell: pwsh
        run: |
          $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("launcher.ps1", [ref]$null, [ref]$e)
          if ($e) { $e; exit 1 }
